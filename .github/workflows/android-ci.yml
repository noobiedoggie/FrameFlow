name: Android CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'FrameFlow-debug.apk'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests, Android Lint, and assemble debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Commit APK to repository and update release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FrameFlow-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f FrameFlow-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update FrameFlow-debug.apk from GitHub Actions [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 FrameFlow-debug.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.0.0 FrameFlow-debug.apk \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_REF_NAME}" \
              --title "FrameFlow v1.0.0" \
              --notes "Automated Android debug APK built and verified by GitHub Actions (run #${GITHUB_RUN_NUMBER})."
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Lint report
        uses: actions/upload-artifact@v4
        with:
          name: frameflow-lint-report
          path: app/build/reports/lint-results-debug.html
